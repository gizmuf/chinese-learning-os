location = /api/reading-tutor {
    if ($request_method !~ ^(GET|POST)$) { return 405; }
    set $reading_tutor_origin $http_origin;
    if ($request_method = GET) { set $reading_tutor_origin https://cos.l00p.network; }
    if ($reading_tutor_origin != https://cos.l00p.network) { return 403; }

    client_max_body_size 64k;
    proxy_pass https://chineseos.l00p.network/api/reading-tutor;
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_set_header Host chineseos.l00p.network;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Origin $reading_tutor_origin;
    proxy_set_header Connection "";
    proxy_hide_header Set-Cookie;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_redirect off;

    proxy_ssl_server_name on;
    proxy_ssl_name chineseos.l00p.network;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_connect_timeout 5s;
    proxy_read_timeout 45s;
    proxy_next_upstream off;
}

location ^~ /api/reading-tutor/ { return 404; }
