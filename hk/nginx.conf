include /etc/nginx/snippets/chineseos-lesson10-maps.conf;
server {
 listen 80 default_server;
 listen [::]:80 default_server;
 server_name _;
 root /var/www/chineseos/current;
 index index.html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 gzip on;
 gzip_types text/css application/javascript application/json image/svg+xml;
 location = /api/dictionary { proxy_pass http://127.0.0.1:8788; proxy_read_timeout 15s; }
 location = /api/character-data { proxy_pass http://127.0.0.1:8788; proxy_read_timeout 15s; }
 include /etc/nginx/snippets/chineseos-lesson10-location.conf;
 location /api/ { default_type application/json; return 503 '{"error":"Account sync is not available on this test server"}'; }
 location /connection-test/ { alias /var/www/html/; index index.html; }
 location /characters/ { try_files $uri =404; }
 location /assets/ { try_files $uri =404; }
 location /dictionary/ { try_files $uri =404; }
 location / { try_files $uri $uri/ /index.html; }
}
