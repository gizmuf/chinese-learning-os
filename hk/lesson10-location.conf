# Include inside the existing server; maps belong in http context.
location = /api/lesson10-material {
 if ($lesson10_pdf = "") { return 404; }
 if ($request_method !~ ^(GET|HEAD)$) { return 405; }
 if ($http_if_none_match = $lesson10_etag) { return 304; }
 try_files /lesson10-materials/$lesson10_pdf =404;
 types { }
 default_type application/pdf;
 etag off;
 add_header Content-Disposition 'attachment; filename="$lesson10_pdf"' always;
 add_header ETag $lesson10_etag always;
 add_header Cache-Control 'public, max-age=3600' always;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
}
location /lesson10-materials/ { try_files $uri =404; }
