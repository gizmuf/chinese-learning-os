    @media(max-width:800px){#chinese-atlas-concepts .os-app{grid-template-columns:116px minmax(0,1fr)}#chinese-atlas-concepts .os-main{padding:24px 18px}#chinese-atlas-concepts .os-nav{font-size:11px}#chinese-atlas-concepts .os-brand{font-size:18px}#chinese-atlas-concepts .os-heading{padding-right:30px}#chinese-atlas-concepts .os-flow{grid-template-columns:repeat(2,minmax(0,1fr))}#chinese-atlas-concepts .os-lane:nth-child(2){border-right:0}#chinese-atlas-concepts .os-lane:nth-child(-n+2){border-bottom:1px solid var(--os-line)}}
    @media(max-width:680px){#chinese-atlas-concepts .os-app{display:block;min-height:1160px}#chinese-atlas-concepts .os-sidebar{display:none}#chinese-atlas-concepts .os-heading{padding-right:70px}#chinese-atlas-concepts .os-mobile-brand{display:block;font-size:11px;color:var(--os-muted)}#chinese-atlas-concepts .os-workspace{grid-template-columns:1fr}#chinese-atlas-concepts .os-family{grid-template-columns:repeat(4,minmax(0,1fr))}#chinese-atlas-concepts .os-family button{min-height:118px}#chinese-atlas-concepts .os-family .os-hanzi{font-size:42px}#chinese-atlas-concepts .os-focus{min-height:300px}#chinese-atlas-concepts .os-path-family .os-family{grid-template-columns:repeat(2,minmax(0,1fr))}#chinese-atlas-concepts .os-clue{min-height:0}}
    @media(max-width:440px){#chinese-atlas-concepts .os-app{min-height:1400px}#chinese-atlas-concepts .os-main{padding:20px 14px}#chinese-atlas-concepts .os-heading{padding-right:66px;align-items:flex-start}#chinese-atlas-concepts .os-concept{display:none}#chinese-atlas-concepts h1{font-size:25px}#chinese-atlas-concepts .os-modes{grid-template-columns:1fr}#chinese-atlas-concepts .os-mode small{display:inline;margin-left:8px}#chinese-atlas-concepts .os-mode strong{display:inline}#chinese-atlas-concepts .os-trail{grid-template-columns:repeat(2,minmax(0,1fr))}#chinese-atlas-concepts .os-trail button:nth-child(2)::after{content:''}#chinese-atlas-concepts .os-family{grid-template-columns:repeat(2,minmax(0,1fr))}#chinese-atlas-concepts .os-flow{grid-template-columns:1fr}#chinese-atlas-concepts .os-lane:not(:last-child){border:0;border-bottom:1px solid var(--os-line)}#chinese-atlas-concepts .os-lane{padding:18px}#chinese-atlas-concepts .os-lane .os-hanzi{font-size:48px;margin:0}#chinese-atlas-concepts .os-footer{flex-wrap:wrap}}
  </style>
  <script>
  (()=>{
    const root=document.getElementById('chinese-atlas-concepts');
    const glyphs=JSON.parse(root.querySelector('#atlas-concept-glyphs').textContent);
    const types={meaning:{title:'Meaning',sub:'People · 亻',icon:'leaf',part:'亻',key:'person',name:'People',clue:'亻 gives a clue about people. Start with a small, readable family.',role:'Meaning clue',items:['你','他','们','休']},sound:{title:'Sound',sub:'Related sounds · 青',icon:'audio-lines',part:'青',key:'qing',name:'The 青 sound family',clue:'A related sound, sometimes with a different tone. Each character keeps its own meaning.',role:'Sound clue',items:['清','晴','情','请']},shape:{title:'Shape',sub:'Visual comparison · 人',icon:'shapes',part:'人',key:'person',name:'Shape comparison',clue:'A similar outline is not a meaning or sound explanation.',role:'Shape only',items:['火']}};
    const entries={
      '你':{p:'nǐ',m:'you',w:'你好',wp:'nǐ hǎo',wm:'hello',s:'你好，很高兴认识你。',sp:'Nǐ hǎo, hěn gāoxìng rènshi nǐ.',sm:'Hello, nice to meet you.',other:'尔'},
      '他':{p:'tā',m:'he / him',w:'他们',wp:'tāmen',wm:'they',s:'他们是我的朋友。',sp:'Tāmen shì wǒ de péngyou.',sm:'They are my friends.',other:'也'},
      '们':{p:'men',m:'plural marker',w:'我们',wp:'wǒmen',wm:'we / us',s:'我们一起学习。',sp:'Wǒmen yìqǐ xuéxí.',sm:'We study together.',other:'门'},
      '休':{p:'xiū',m:'rest',w:'休息',wp:'xiūxi',wm:'to rest',s:'你需要休息。',sp:'Nǐ xūyào xiūxi.',sm:'You need to rest.',other:'木'},
      '清':{p:'qīng',m:'clear',w:'清水',wp:'qīngshuǐ',wm:'clear water',s:'这里有清水。',sp:'Zhèlǐ yǒu qīngshuǐ.',sm:'There is clear water here.',other:'氵'},
      '晴':{p:'qíng',m:'sunny',w:'晴天',wp:'qíngtiān',wm:'a sunny day',s:'今天是晴天。',sp:'Jīntiān shì qíngtiān.',sm:'Today is a sunny day.',other:'日'},
      '情':{p:'qíng',m:'feeling',w:'心情',wp:'xīnqíng',wm:'mood',s:'我的心情很好。',sp:'Wǒ de xīnqíng hěn hǎo.',sm:'I am in a good mood.',other:'忄'},
      '请':{p:'qǐng',m:'please / invite',w:'请问',wp:'qǐngwèn',wm:'may I ask…',s:'请问，学校在哪里？',sp:'Qǐngwèn, xuéxiào zài nǎlǐ?',sm:'Excuse me, where is the school?',other:'讠'},
      '火':{p:'huǒ',m:'fire',w:'火车',wp:'huǒchē',wm:'train',s:'我坐火车去上海。',sp:'Wǒ zuò huǒchē qù Shànghǎi.',sm:'I take the train to Shanghai.',other:null}
    };
    const saved=window.openai?.widgetState?.modelContent;
    const state={mode:types[saved?.mode]?saved.mode:'meaning',char:'你',stage:['component','character','word','sentence'].includes(saved?.stage)?saved.stage:'word'};
    state.char=types[state.mode].items.includes(saved?.character)?saved.character:types[state.mode].items[state.mode==='sound'?1:0];
    const preferences={pinyin:window.openai?.widgetState?.privateContent?.pinyin!==false};
    const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const reading=s=>preferences.pinyin?`<span class="os-reading">${safe(s)}</span>`:'';
    function draw(text,mode=state.mode){
      const t=types[mode];return `<span class="os-hanzi" role="img" aria-label="${safe(text)}">${Array.from(text).map(c=>{
        const g=glyphs[c],indices=g?.parts[t.key];
        if(!g||!indices?.length)return `<span aria-hidden="true">${safe(c)}</span>`;
        const paths=g.strokes.map((d,i)=>`<path d="${safe(d)}" fill="${indices.includes(i)?'var(--os-red)':'currentColor'}"/>`).join('');
        return `<svg viewBox="0 0 1024 1024" aria-hidden="true"><g transform="scale(1,-1) translate(0,-900)">${paths}</g></svg>`;
      }).join('')}</span>`;
    }
    function role(){return `<span class="os-role"><i data-lucide="${types[state.mode].icon}" aria-hidden="true"></i>${types[state.mode].role}</span>`;}
    function family(){return `<div class="os-section-title"><h2>${types[state.mode].name}</h2><small>${state.mode==='shape'?'One comparison':'4 example characters'}</small></div><p class="os-clue">${types[state.mode].clue}</p><div class="os-family">${types[state.mode].items.map(c=>`<button class="cursor-interaction" data-char="${c}" aria-pressed="${state.char===c}" aria-label="${safe(c+' · '+entries[c].p+' · '+entries[c].m)}">${draw(c)}${reading(entries[c].p)}<span class="os-word-meaning">${entries[c].m}</span></button>`).join('')}</div><div class="os-legend"><span ${state.mode==='shape'?'style="background:var(--os-shape)"':''}></span>${state.mode==='shape'?'Shape only · no meaning or sound clue':'Shared part · colour does not define its role'}</div>`;}
    function sidebar(){return `<aside class="os-sidebar"><div class="os-brand">chinese<span>os</span></div><nav class="os-nav" aria-label="Study space"><span><i data-lucide="house" aria-hidden="true"></i>Today</span><span><i data-lucide="book-open" aria-hidden="true"></i>My lessons</span><span><i data-lucide="graduation-cap" aria-hidden="true"></i>Course</span><span aria-current="page"><i data-lucide="network" aria-hidden="true"></i>Cloud Atlas</span><span><i data-lucide="pen-line" aria-hidden="true"></i>Writing studio</span><span><i data-lucide="rotate-ccw" aria-hidden="true"></i>Review</span><span><i data-lucide="chart-no-axes-combined" aria-hidden="true"></i>My progress</span></nav><small>A little, every day.</small></aside>`;}
    function modes(){return `<div class="os-modes" aria-label="Type of connection">${Object.entries(types).map(([key,t])=>`<button class="os-mode cursor-interaction" data-mode="${key}" aria-pressed="${state.mode===key}"><i data-lucide="${t.icon}" aria-hidden="true"></i><span><strong>${t.title}</strong><small>${t.sub}</small></span></button>`).join('')}</div>`;}
    function trail(){const e=entries[state.char];return `<nav class="os-trail" aria-label="Component to sentence">${[['component',types[state.mode].part,'Component'],['character',state.char,'Character'],['word',e.w,'Word'],['sentence',Array.from(e.s).slice(0,4).join('')+'…','Sentence']].map(([key,g,label])=>`<button class="cursor-interaction" data-stage="${key}" ${key==='sentence'?`data-tooltip="${safe(e.s)}"`:''} ${state.stage===key?'aria-current="step"':''}><small>${label}</small><b>${safe(g)}</b></button>`).join('')}</nav>`;}
    function focus(){const e=entries[state.char],t=types[state.mode],s=state.stage;const text=s==='component'?t.part:s==='character'?state.char:s==='word'?e.w:e.s;const p=s==='component'?(state.mode==='sound'?'qīng':state.mode==='meaning'?'rén zì páng':'rén'):s==='character'?e.p:s==='word'?e.wp:e.sp;const meaning=s==='component'?(state.mode==='sound'?'A sound reference':'Person-shaped component'):s==='character'?e.m:s==='word'?e.wm:e.sm;return `<section class="os-focus" data-stage="${s}" aria-live="polite"><div class="os-eyebrow">${s}</div>${role()}${s==='component'?`<span class="os-hanzi os-highlight" lang="zh-Hans">${t.part}</span>`:draw(text)}${reading(p)}<p>${meaning}</p><div class="os-context">${s==='sentence'?'From the word':s==='word'?'Built from':'Continue into the word'}<strong lang="zh-Hans">${s==='word'?Array.from(e.w).join(' + '):e.w}</strong>${s==='word'?'One useful expression, then a real sentence.':e.wm}</div></section>`;}
    function flow(){const e=entries[state.char],t=types[state.mode];return `<div class="os-flow" aria-label="Four connected stages"><section class="os-lane"><div class="os-eyebrow">Component →</div><span class="os-hanzi os-highlight" lang="zh-Hans">${t.part}</span>${role()}<p>${state.mode==='meaning'?'People-related meaning':state.mode==='sound'?'Related sound, variable tone':'Shape comparison only'}</p></section><section class="os-lane"><div class="os-eyebrow">Character →</div>${draw(state.char)}${reading(e.p)}<p>${e.m}</p>${e.other?`<span class="os-reading" lang="zh-Hans">${t.part} + ${e.other}</span>`:''}</section><section class="os-lane"><div class="os-eyebrow">Word →</div>${draw(e.w)}${reading(e.wp)}<p>${e.wm}</p></section><section class="os-lane"><div class="os-eyebrow">Sentence</div>${draw(e.s)}${reading(e.sp)}<p>${e.sm}</p></section></div>`;}
    function render(){
      root.querySelectorAll('.os-app').forEach(app=>{
        app.dataset.relation=state.mode;
        app.innerHTML=sidebar()+`<main class="os-main"><header class="os-heading"><div><span class="os-mobile-brand">chineseos</span><div class="os-eyebrow">Follow one connection</div><h1>Cloud Atlas.</h1></div><span class="os-concept">Design concept</span></header>${modes()}${app.dataset.layout==='family'?trail()+`<div class="os-workspace"><section>${family()}</section>${focus()}</div>`:`${flow()}<section class="os-path-family">${family()}</section>`}<footer class="os-footer"><span>Small steps. Lasting connections.</span><span>Example content · no progress saved</span></footer></main>`;
      });
      if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
    }
    function persist(){window.openai?.setWidgetState?.({modelContent:{mode:state.mode,character:state.char,stage:state.stage},privateContent:{pinyin:preferences.pinyin}})?.catch(()=>{});}
    root.addEventListener('click',event=>{const button=event.target.closest('.os-app button');if(!button)return;const layout=button.closest('.os-app').dataset.layout;const key=button.dataset.mode?'mode':button.dataset.char?'char':'stage';const value=button.dataset[key];if(button.dataset.mode){state.mode=button.dataset.mode;state.char=types[state.mode].items[state.mode==='sound'?1:0];}if(button.dataset.char)state.char=button.dataset.char;if(button.dataset.stage)state.stage=button.dataset.stage;render();root.querySelector('.os-app[data-layout="'+layout+'"] [data-'+key+'="'+value+'"]')?.focus({preventScroll:true});persist();});
    window.addEventListener('openai:set_globals',event=>{const v=event.detail?.globals?.widgetState;if(!v)return;const m=v.modelContent;if(types[m?.mode]){state.mode=m.mode;state.char=types[state.mode].items.includes(m.character)?m.character:types[state.mode].items[0];}if(['component','character','word','sentence'].includes(m?.stage))state.stage=m.stage;if(typeof v.privateContent?.pinyin==='boolean')preferences.pinyin=v.privateContent.pinyin;render();});
    render();
    if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{render();persist();}});tweak.addToggle(preferences,'pinyin',{label:'Pinyin under characters'});}
  })();
  </script>
</div>
<nav id="reference-variants" aria-label="Prototype view" style="position:sticky;bottom:0;z-index:100;padding:14px;display:flex;flex-wrap:wrap;gap:8px;background:#fff;color:#29473d;border-radius:12px;border:1px solid #cbd7c4"></nav><script>(()=>{const sections=[...document.querySelectorAll('[data-variant]')],names=["Family + context", "Complete path"],bar=document.getElementById('reference-variants');sections.forEach((section,i)=>{const button=document.createElement('button');button.textContent=(i+1)+' / '+sections.length+' '+names[i];button.style.cssText='padding:10px 14px;border:1px solid #94aa98;border-radius:8px;background:#f4f7ef;color:#29473d;min-height:44px;cursor:pointer';button.setAttribute('aria-pressed',String(i===0));button.onclick=()=>{sections.forEach((s,j)=>s.hidden=i!==j);[...bar.children].forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));window.dispatchEvent(new Event('resize'));window.scrollTo({top:0,behavior:'smooth'});};bar.appendChild(button);});})();</script></body></html>
