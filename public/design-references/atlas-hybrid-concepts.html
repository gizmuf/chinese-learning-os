<script>
(()=>{
 const root=document.getElementById('hybrid-atlas-options'),data=JSON.parse(document.getElementById('hybrid-atlas-data').textContent);
 const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const states={layers:{set:'study',hanzi:'学',word:'',part:'',wp:0,cp:0},orbit:{set:'study',hanzi:'学',word:'',part:'',wp:0,cp:0},matrix:{set:'study',hanzi:'学',word:'',part:'',wp:0,cp:0}},designs={};
 const highlighted=(word,h)=>esc(word).split(esc(h)).join('<span class="hm-common">'+esc(h)+'</span>');
 function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{hybridConcepts:states}}).catch(()=>{})}
 function restore(saved){const value=saved?.modelContent?.hybridConcepts;if(!value)return;for(const mode of Object.keys(states)){const s=value[mode];if(s&&Object.hasOwn(data,s.set))states[mode]={...states[mode],...s,wp:Number.isInteger(s.wp)?Math.max(0,s.wp):0,cp:Number.isInteger(s.cp)?Math.max(0,s.cp):0}}}
 function wordButtons(words,h){return words.map(w=>'<button type="button" class="cursor-interaction" data-word="'+esc(w.id)+'" aria-label="'+esc(w.h+' · '+w.p+' · '+w.m)+'">'+highlighted(w.h,h)+'</button>').join('')}
 function drawLinks(node){const container=node.querySelector('.hm-layers');if(!container||!container.clientWidth)return;const r=container.getBoundingClientRect(),center=container.querySelector('[data-hanzi-main]').getBoundingClientRect();let paths='';for(const el of container.querySelectorAll('[data-part]')){const b=el.getBoundingClientRect();paths+='<path class="part" d="M '+(b.right-r.left)+' '+(b.top+b.height/2-r.top)+' L '+(center.left-r.left)+' '+(center.top+center.height/2-r.top)+'"/>'}for(const el of container.querySelectorAll('[data-word]')){const b=el.getBoundingClientRect();paths+='<path d="M '+(center.right-r.left)+' '+(center.top+center.height/2-r.top)+' L '+(b.left-r.left)+' '+(b.top+b.height/2-r.top)+'"/>'}const svg=container.querySelector('svg');svg.setAttribute('viewBox','0 0 '+r.width+' '+r.height);svg.innerHTML=paths}
 function render(node){
  const mode=node.dataset.mode,s=states[mode],d=data[s.set],chars=[...d.chars].sort((a,b)=>b.count-a.count||a.h.localeCompare(b.h));
  if(!chars.some(c=>c.h===s.hanzi))s.hanzi=chars[0].h;const ch=chars.find(c=>c.h===s.hanzi),words=d.words.filter(w=>w.h.includes(ch.h));const selected=d.words.find(w=>w.id===s.word&&w.h.includes(ch.h))??words[0];s.word=selected?.id??'';
  node.querySelector('[data-set]').value=s.set;node.querySelector('[data-counts]').textContent=d.words.length+' słów · '+d.chars.length+' unikalnych hanzi · '+d.occurrences+' wystąpień znaków';
  node.querySelector('[data-index-label]').textContent='Indeks wszystkich znaków · '+chars.length;
  node.querySelector('[data-index]').innerHTML=chars.map(c=>'<button type="button" class="cursor-interaction" data-char="'+esc(c.h)+'" aria-pressed="'+(c.h===ch.h)+'"><span class="hm-glyph">'+esc(c.h)+'</span><small>'+c.count+' słów</small></button>').join('');
  const main=node.querySelector('[data-drawing]');
  if(mode==='layers'){
   const parts=ch.parts.length?ch.parts.map(p=>'<button type="button" class="cursor-interaction" data-part="'+esc(p)+'" aria-pressed="'+(p===s.part)+'">'+esc(p)+'</button>').join(''):'<span class="hm-heading">Znak prosty</span>';
   main.innerHTML='<div class="hm-layers"><svg class="hm-links" role="img" aria-label="Współczesne części znaku i słowa zawierające wybrany znak"></svg><div class="hm-parts"><span class="hm-heading">Komponenty</span>'+parts+'</div><div class="hm-char-main"><span class="hm-heading">Hanzi</span><button type="button" class="cursor-interaction hm-common" data-hanzi-main>'+esc(ch.h)+'</button><small>'+esc(ch.p)+'<br>'+esc(ch.m)+'</small></div><div><p class="hm-heading">'+words.length+' / '+d.words.length+' słów</p><div class="hm-words">'+wordButtons(words,ch.h)+'</div></div></div><div class="hm-legend">Linia przerywana: budowa współczesnego znaku. Linia ciągła: wspólny zapis w słowie.</div>';
   requestAnimationFrame(()=>drawLinks(node));
  }else if(mode==='orbit'){
   const top=chars.slice(0,8),nodes=top.map((c,i)=>{const a=2*Math.PI*i/top.length-Math.PI/2,x=50+36*Math.cos(a),y=50+36*Math.sin(a);return '<button type="button" class="hm-cluster cursor-interaction" style="left:'+x+'%;top:'+y+'%" data-char="'+esc(c.h)+'" aria-pressed="'+(c.h===ch.h)+'"><span class="hm-glyph">'+esc(c.h)+'</span><small>'+c.count+' słów</small></button>'}).join('');
   main.innerHTML='<div class="hm-orbit-layout"><div><div class="hm-orbit"><div class="hm-orbit-ring"></div><div class="hm-orbit-center"><strong>'+d.words.length+'</strong>słów w zbiorze</div>'+nodes+'</div><p class="hm-heading">'+top.length+' najczęstszych z '+chars.length+' znaków · rodziny nakładają się</p></div><div class="hm-orbit-words"><h3><span class="hm-glyph hm-common">'+esc(ch.h)+'</span> · '+words.length+' słów</h3><div class="hm-words">'+wordButtons(words,ch.h)+'</div></div></div>';
  }else{
   const count=Math.max(3,Math.min(10,Math.floor((node.clientWidth-130)/43))),wordPages=Math.ceil(d.words.length/12),charPages=Math.ceil(chars.length/count);s.wp=Math.min(s.wp,wordPages-1);s.cp=Math.min(s.cp,charPages-1);const ws=d.words.slice(s.wp*12,s.wp*12+12),hs=chars.slice(s.cp*count,s.cp*count+count);
   main.innerHTML='<p class="hm-matrix-caption">Wiersze: całe słowa · kolumny: ich znaki · punkt = znak obecny w słowie</p><table class="hm-matrix" aria-label="Macierz obecności znaków w słowach"><thead><tr><th>Słowo</th>'+hs.map(c=>'<th><button type="button" class="cursor-interaction" data-char="'+esc(c.h)+'">'+esc(c.h)+'</button></th>').join('')+'</tr></thead><tbody>'+ws.map(w=>'<tr><td><button type="button" class="cursor-interaction" data-word="'+esc(w.id)+'">'+esc(w.h)+'</button></td>'+hs.map(c=>w.h.includes(c.h)?'<td><button type="button" class="hm-dot cursor-interaction '+(c.h===ch.h?'is-shared':'')+'" data-word="'+esc(w.id)+'" data-cell-char="'+esc(c.h)+'" aria-label="'+esc(c.h+' w '+w.h)+'"></button></td>':'<td class="empty">·</td>').join('')+'</tr>').join('')+'</tbody></table><div class="hm-paging"><button type="button" class="cursor-interaction" data-page="wp" data-delta="-1" '+(!s.wp?'disabled':'')+'>Poprzednie słowa</button><span>'+Math.min(s.wp*12+1,d.words.length)+'–'+Math.min((s.wp+1)*12,d.words.length)+' / '+d.words.length+'</span><button type="button" class="cursor-interaction" data-page="wp" data-delta="1" '+(s.wp>=wordPages-1?'disabled':'')+'>Następne słowa</button></div><div class="hm-paging"><button type="button" class="cursor-interaction" data-page="cp" data-delta="-1" '+(!s.cp?'disabled':'')+'>Poprzednie znaki</button><span>'+Math.min(s.cp*count+1,chars.length)+'–'+Math.min((s.cp+1)*count,chars.length)+' / '+chars.length+'</span><button type="button" class="cursor-interaction" data-page="cp" data-delta="1" '+(s.cp>=charPages-1?'disabled':'')+'>Następne znaki</button></div>';
  }
  const partCount=s.part?d.chars.filter(c=>c.parts.includes(s.part)).length:0;
  node.querySelector('[data-detail]').innerHTML=selected?'<strong>'+highlighted(selected.h,ch.h)+'</strong><span>'+esc(selected.p)+' · '+esc(selected.m)+'</span><small>'+esc(selected.s)+'</small>'+(s.part?'<small>Część '+esc(s.part)+' w '+partCount+' / '+chars.length+' znaków tej próbki</small>':''):'';
  node.querySelectorAll('[data-word]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.word===s.word)));
 }
 restore(window.openai?.widgetState);
 for(const node of root.querySelectorAll('.hm-window')){
  const mode=node.dataset.mode;render(node);
  node.querySelector('[data-set]').addEventListener('change',e=>{states[mode]={...states[mode],set:e.target.value,word:'',part:'',wp:0,cp:0};render(node);save()});
  node.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const s=states[mode];if(b.dataset.char){s.hanzi=b.dataset.char;s.word='';s.part=''}else if(b.dataset.part){s.part=s.part===b.dataset.part?'':b.dataset.part}else if(b.dataset.word){if(b.dataset.cellChar)s.hanzi=b.dataset.cellChar;const word=data[s.set].words.find(w=>w.id===b.dataset.word);if(word&&!word.h.includes(s.hanzi))s.hanzi=Array.from(word.h).find(h=>data[s.set].chars.some(c=>c.h===h));s.word=b.dataset.word}else if(b.dataset.page){s[b.dataset.page]=Math.max(0,s[b.dataset.page]+Number(b.dataset.delta))}else return;render(node);save()});
  let width=0;const observer=new ResizeObserver(()=>{if(node.clientWidth&&node.clientWidth!==width){width=node.clientWidth;render(node)}});observer.observe(node);
  if(globalThis.Tweak){const design=designs[mode]={glyph:26,edges:.4};const tweak=new Tweak({container:node,onChange:()=>{node.style.setProperty('--hm-glyph',design.glyph+'px');node.style.setProperty('--hm-edge-alpha',design.edges)}});tweak.addSlider(design,'glyph',{label:'Rozmiar hanzi',min:22,max:34,unit:'px'});if(mode==='layers')tweak.addSlider(design,'edges',{label:'Widoczność połączeń',min:.15,max:.8,step:.05})}
 }
 window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState;if(saved){restore(saved);root.querySelectorAll('.hm-window').forEach(render)}});
})();
</script>
